[package]
name = "eos_desktop"
version = "0.1.0"
edition = "2021"
description = "OptiGest Cloud Offline - client desktop EosMedTech"

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
docx-rs = { version = "0.4.22", default-features = false }
argon2 = { version = "0.5", features = ["std", "rand"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ed25519-dalek = "2"
base64 = "0.22"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = ["Foundation", "Security_Credentials_UI"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
