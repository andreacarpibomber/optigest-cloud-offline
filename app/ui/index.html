<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EosMedTech - OptiGest Cloud Offline</title>
	<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
	<section id="view-splash" class="view active">
		<img id="logo" class="logo" src="assets/img/logo.svg" alt="EosMedTech">
		
		<div style="padding-top: 2em"></div>
		<div class="loader"><span></span></div>
		<p id="splash-host" class="site"></p>
		<p id="splash-note" class="note"></p>
		<button id="btn-repair" class="link hidden" type="button">Riapri la finestra di accesso</button>
	</section>

	<!-- Impostazione / sblocco PIN -->
	<section id="view-pin" class="view">
		<img class="logo small" src="assets/img/logo.svg" alt="EosMedTech">
		<h2 id="pin-title"></h2>
		<form id="pin-form" autocomplete="off">
			<input id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">
			<input id="pin-confirm" class="hidden" type="password" inputmode="numeric" maxlength="8" placeholder="Ripeti il PIN" autocomplete="off">
			<button type="submit" id="pin-submit">Continua</button>
		</form>
		<button id="btn-biometric" class="link hidden" type="button" title="Sblocca con impronta" aria-label="Sblocca con impronta" style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 18px auto 0; color: var(--primary, #1c2541);">
			<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
			<span>Sblocca con impronta</span>
		</button>
		<p id="pin-error" class="error"></p>
		<button id="btn-support" class="link" type="button">Richiedi supporto</button>
	</section>

	<footer class="copyright">
		<a href="https://www.eosmedtech.com/" target="_blank" rel="noopener">Copyright &copy; EosMedTech Srl</a>
		<span id="app-version" class="app-version"></span>
	</footer>

	<!-- Selettore host (click sul nome dell'host, oppure long press 3s sul logo dello splash) -->
	<div id="host-overlay" class="overlay hidden">
		<div class="sheet">
			<h3>Seleziona host</h3>
			<ul id="host-list"></ul>
			<button id="host-cancel" class="link" type="button">Annulla</button>
		</div>
	</div>

	<script src="assets/js/common.js"></script>
	<script src="assets/js/index.js"></script>
</body>
</html>
