<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Licenza - OptiGest Cloud Offline</title>
	<link rel="stylesheet" href="assets/css/app.css">
	<script src="assets/js/theme.js"></script>
</head>
<body class="page">
	<main class="content license-box">
		<img class="license-logo" src="assets/img/logo.svg" alt="EosMedTech">
		<h1 class="page-title">Licenza</h1>
		<p id="license-message" class="license-message"></p>
		<p id="license-expiry" class="settings-hint"></p>
		<div class="license-actions">
			<button id="btn-recheck" class="btn-primary" type="button">Ricontrolla licenza</button>
			<button id="btn-logout" class="link" type="button">Disconnetti</button>
		</div>
		<p id="license-result" class="settings-message"></p>
	</main>
	<script src="assets/js/common.js"></script>
	<script src="assets/js/license.js"></script>
</body>
</html>
